name: Fold Actions Preflight
run-name: Fold actions preflight (${{ github.event_name }})

on:
  pull_request:
    branches:
      - foldable-split-keyboard-dev
    paths:
      - ".github/workflows/fold-actions-preflight.yml"
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    name: Read-only runner preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Report trigger context
        run: |
          echo "preflight ok"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
